
name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preparar Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Preparar download direto
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Analista-Cloud-ADM.apk
          ls -lh dist/Analista-Cloud-ADM.apk

      - name: Publicar APK sem ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view cloud-adm-latest >/dev/null 2>&1; then
            gh release upload cloud-adm-latest dist/Analista-Cloud-ADM.apk --clobber
          else
            gh release create cloud-adm-latest dist/Analista-Cloud-ADM.apk \
              --title "ANALISTA CLOUD ADM - APK" \
              --notes "APK Android para instalação direta." \
              --latest
          fi

      - name: Guardar copia
        uses: actions/upload-artifact@v4
        with:
          name: ANALISTA-CLOUD-ADM-APK
          path: dist/Analista-Cloud-ADM.apk
          if-no-files-found: error
